<svg width="460" height="127" viewBox="0 0 460 127" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* アニメーションの基本設定 */
    .swoosh-group {
      transform-origin: 225px 63px;
      animation: swooshSpin 1.1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* キーフレーム定義 */
    @keyframes swooshSpin {
      0% {
        opacity: 0;
        transform: rotate(-160deg) scale(0.7);
      }
      100% {
        opacity: 1;
        transform: rotate(0deg) scale(1);
      }
    }
  </style>

  <!-- 循環を表す3つの弧（スウッシュ） -->
  <g class="swoosh-group">
    <path d="M300.645 34.2593C287.02 -5.52333 222.491 -13.0923 183.475 34.7841C220.896 -11.1345 328.277 11.0275 286.132 84.8001C302.966 62.7591 304.843 46.511 300.645 34.2593Z" fill="#00A000"/>
    <path d="M236.56 0.025747C211.774 -0.620141 177.481 10.8847 156.509 34.6817H172.112C186.664 13.9729 213.792 0.792739 236.56 0.025747Z" fill="#CCCCCC"/>
    <path d="M268.976 103.976H251.375C239.426 110.072 230.323 114.956 213.61 117.923C189.894 122.142 155.964 116.167 145.468 102.523C170.557 135.1 236.782 132.779 268.996 103.956L268.976 103.976Z" fill="#CCCCCC"/>
  </g>
</svg>
